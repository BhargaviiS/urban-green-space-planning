name: Update live data

on:
  schedule:
    - cron: "0 3 * * 1,4"   # Mondays and Thursdays, 03:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Fetch new Sentinel-2 scenes and recompute ward statistics
        run: python update_pipeline.py --months 3 --max-scenes 12

      - name: Commit refreshed data
        run: |
          git config user.name "green-space-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated data refresh $(date -u +%F)"
            git push
          fi
